<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperium — Sales Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07070A; --panel:#0E0E13; --line:#1E1E27;
  --gold:#C9A227; --gold-lo:#8A6F1A; --gold-hi:#F2D98B;
  --txt:#E8E6E0; --mute:#6E6C78; --alert:#C4553D; --ok:#4A7C59;
  --sq:'Michroma','Chakra Petch',sans-serif;   /* Bank Gothic-style display */
  --ui:'Chakra Petch',sans-serif;               /* squared UI face */
  --mo:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font-family:var(--ui);
  height:100vh;overflow:hidden;padding:1.1vh 1vw;display:flex;flex-direction:column;gap:1vh}

/* ---- top bar ---- */
header{display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:.9vh}
.brand{font-family:var(--sq);font-size:1.9vh;letter-spacing:.16em;color:var(--gold-hi)}
.brand span{color:var(--mute);letter-spacing:.34em;font-family:var(--ui);font-weight:500;
  font-size:1.15vh;margin-left:1.1vw}
.stamp{font-family:var(--mo);font-size:1.2vh;color:var(--mute);letter-spacing:.12em;text-align:right}
.stamp b{color:var(--gold);font-weight:500}

/* ---- kpi strip ---- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:.6vw}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold-lo);
  padding:1.1vh 1vw;display:flex;flex-direction:column;justify-content:space-between;gap:.7vh}
.kpi .lab{font-family:var(--ui);font-weight:600;font-size:1.1vh;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute)}
.kpi .val{font-family:var(--sq);font-size:2.9vh;line-height:1;color:var(--gold-hi);letter-spacing:.02em}
.kpi .sub{font-family:var(--mo);font-size:1.05vh;color:var(--mute)}
.kpi.warn{border-top-color:var(--alert)}
.kpi.warn .val{color:var(--alert)}

/* ---- main grid ---- */
main{flex:1;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:.6vw;min-height:0}
.col{display:flex;flex-direction:column;gap:.6vh;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);padding:1.1vh 1vw;display:flex;
  flex-direction:column;min-height:0;overflow:hidden}
.card h2{font-family:var(--sq);font-size:1.1vh;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);padding-bottom:.9vh;border-bottom:1px solid var(--line);margin-bottom:1vh;
  display:flex;justify-content:space-between;align-items:center;gap:.6vw}
.card h2 em{font-style:normal;color:var(--mute);font-family:var(--mo);font-size:1vh;
  letter-spacing:.08em;text-transform:none;white-space:nowrap}

/* ---- funnel ---- */
.fnl{display:flex;flex-direction:column;gap:.75vh;flex:1;justify-content:center}
.stage{display:grid;grid-template-columns:10.5vw 1fr 3.2vw;align-items:center;gap:.5vw}
.stage .nm{font-family:var(--ui);font-weight:600;font-size:1.2vh;letter-spacing:.14em;
  color:var(--txt);text-transform:uppercase}
.stage .track{height:1.9vh;background:#141419;position:relative;overflow:hidden}
.stage .fill{height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold));transition:width .8s}
.stage.won .fill{background:linear-gradient(90deg,#2F5E43,var(--ok))}
.stage.lost .fill{background:linear-gradient(90deg,#4A2A22,var(--alert))}
.stage .ct{font-family:var(--sq);font-size:1.25vh;color:var(--gold-hi);text-align:right}

/* ---- leaderboard ---- */
.rep{border-bottom:1px solid var(--line);padding:1.1vh 0;display:grid;
  grid-template-columns:2.6vw 1fr auto;gap:.6vw;align-items:center}
.rep:last-child{border-bottom:none}
.rep .rk{font-family:var(--sq);font-size:1.7vh;color:var(--gold-lo);line-height:1}
.rep .nm{font-family:var(--sq);font-size:1.5vh;letter-spacing:.08em;text-transform:uppercase}
.rep .meta{font-family:var(--mo);font-size:1.05vh;color:var(--mute);margin-top:.5vh}
.rep .sc{text-align:right}
.rep .sc b{font-family:var(--sq);font-size:1.9vh;color:var(--gold-hi);font-weight:400}
.rep .sc i{display:block;font-style:normal;font-family:var(--mo);font-size:.95vh;
  color:var(--mute);margin-top:.35vh}
.bar{height:.4vh;background:#141419;margin-top:.7vh}
.bar i{display:block;height:100%;background:var(--gold)}

/* ---- lists ---- */
.rows{overflow:hidden;flex:1}
.row{display:grid;grid-template-columns:1fr auto;gap:.5vw;padding:.72vh 0;
  border-bottom:1px solid #15151C;align-items:center}
.row:last-child{border-bottom:none}
.row .co{font-family:var(--ui);font-weight:500;font-size:1.4vh;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who{font-family:var(--mo);font-size:.95vh;color:var(--mute);letter-spacing:.06em;margin-top:.25vh}
.row .tag{font-family:var(--sq);font-size:1.05vh;text-align:right;white-space:nowrap}
.late{color:var(--alert)}
.money{color:var(--gold-hi)}

/* ---- source table ---- */
.src{display:grid;grid-template-columns:1fr auto auto auto;gap:.3vw .6vw;align-items:center}
.src .h{font-family:var(--ui);font-weight:600;font-size:.95vh;color:var(--mute);letter-spacing:.16em;
  text-transform:uppercase;padding-bottom:.6vh;border-bottom:1px solid var(--line)}
.src .c{font-family:var(--ui);font-weight:500;font-size:1.3vh;letter-spacing:.04em;
  padding:.62vh 0;border-bottom:1px solid #15151C}
.src .n{font-family:var(--mo);font-size:1.2vh;text-align:right;padding:.62vh 0;
  border-bottom:1px solid #15151C;color:var(--mute)}
.src .n.hi{color:var(--gold-hi);font-family:var(--sq);font-size:1vh}

.empty{color:var(--mute);font-family:var(--ui);font-size:1.2vh;text-align:center;
  padding:2vh 0;letter-spacing:.12em;text-transform:uppercase}
.err{position:fixed;bottom:1vh;left:1vw;font-family:var(--mo);font-size:1.05vh;
  color:var(--alert);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">IMPERIUM<span>B2B PIPELINE</span></div>
  <div class="stamp">ACCOUNTS <b id="stamp-pipe">—</b> &nbsp;·&nbsp; UPDATED <b id="stamp-time">—</b></div>
</header>

<section class="kpis" id="kpis"></section>

<main>
  <div class="col">
    <div class="card" style="flex:1.35">
      <h2>Pipeline funnel <em id="fnl-note"></em></h2>
      <div class="fnl" id="funnel"></div>
    </div>
    <div class="card" style="flex:1">
      <h2>Lead source <em>conversion</em></h2>
      <div class="src" id="sources"></div>
    </div>
  </div>

  <div class="col">
    <div class="card" style="flex:1">
      <h2>Account priority <em>open accounts</em></h2>
      <div class="src" id="mix"></div>
    </div>
    <div class="card" style="flex:1">
      <h2>Live deals <em>proposal · negotiating</em></h2>
      <div class="rows" id="hot"></div>
    </div>
  </div>

  <div class="col">
    <div class="card" style="flex:1">
      <h2>Newest accounts <em id="new-note"></em></h2>
      <div class="rows" id="newest"></div>
    </div>
    <div class="card" style="flex:1">
      <h2>Coverage <em>this week</em></h2>
      <div class="rows" id="coverage"></div>
    </div>
  </div>
</main>

<div class="err" id="err"></div>

/* ---------- helpers ---------- */
const OPEN=['NEW LEAD','CONTACTED','QUALIFIED','MEETING SET','PROPOSAL SENT','NEGOTIATING'];
const ORDER=['NEW LEAD','CONTACTED','QUALIFIED','MEETING SET','PROPOSAL SENT','NEGOTIATING','CLOSED WON','CLOSED LOST'];
const money=n=>n>=1000?'$'+Math.round(n/1000)+'K':'$'+Math.round(n||0);
const D=s=>{if(!s)return null;const d=new Date(s.length<=10?s+'T00:00:00':s);return isNaN(d)?null:d;};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const days=(a,b)=>Math.round((b-a)/864e5);
const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function norm(rows){
  return rows.map(r=>({
    rep:(r['Rep']||'').trim(),
    seg:(r['Segment']||'').trim(),
    company:(r['Company']||'').trim(),
    status:(r['Status']||'NEW LEAD').trim().toUpperCase(),
    priority:(r['Priority']||'').trim().toUpperCase(),
    source:(r['Lead Source']||'').trim().toUpperCase(),
    added:D(r['Date Added']),
    lastc:D(r['Last Contact Date']),
    next:D(r['Next Follow-Up Date']),
    meet:D(r['Meeting Date']),
    val:parseFloat(String(r['Monthly Value (USD)']||'').replace(/[$,]/g,''))||0
  })).filter(r=>r.company);
}

/* ---------- render ---------- */
function render(rows){
  const T=today();
  const open=rows.filter(r=>OPEN.includes(r.status));
  const won=rows.filter(r=>r.status==='CLOSED WON');
  const late=rows.filter(r=>['MEETING SET','PROPOSAL SENT','NEGOTIATING'].includes(r.status));
  const wk=new Date(T.getTime()+7*864e5);
  const meets=rows.filter(r=>r.meet&&r.meet>=T&&r.meet<=wk);
  const newWk=rows.filter(r=>r.added&&days(r.added,T)<=7);
  const touchedWk=rows.filter(r=>r.lastc&&days(r.lastc,T)<=7);
  const stale=rows.filter(r=>OPEN.includes(r.status)&&(!r.lastc||days(r.lastc,T)>14));
  const conv=rows.length?(won.length/rows.length*100).toFixed(1):'0.0';

  document.getElementById('stamp-pipe').textContent=rows.length;
  document.getElementById('stamp-time').textContent=
    new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

  const kpi=[
    ['Active leads',open.length,rows.length+' total in CRM'],
    ['New this week',newWk.length,'added to CRM'],
    ['Touched this week',touchedWk.length,'contact logged'],
    ['Meetings booked',meets.length,'next 7 days'],
    ['Late stage',late.length,'proposal or beyond'],
    ['Conversion',conv+'%','lead to customer']
  ];
  document.getElementById('kpis').innerHTML=kpi.map(k=>
    `<div class="kpi${k[3]?' warn':''}"><div class="lab">${k[0]}</div>
     <div class="val">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join('');

  const counts=ORDER.map(s=>({s,n:rows.filter(r=>r.status===s).length}));
  const mx=Math.max(...counts.map(c=>c.n),1);
  document.getElementById('funnel').innerHTML=counts.map(c=>{
    const cls=c.s==='CLOSED WON'?' won':c.s==='CLOSED LOST'?' lost':'';
    return `<div class="stage${cls}"><div class="nm">${c.s}</div>
      <div class="track"><div class="fill" style="width:${c.n/mx*100}%"></div></div>
      <div class="ct">${c.n}</div></div>`;}).join('');
  document.getElementById('fnl-note').textContent=rows.length+' leads';

  const tiers=[['A — High','A'],['B — Medium','B'],['C — Low','C']];
  const mix=tiers.map(t=>{
    const x=open.filter(r=>r.priority.startsWith(t[1]));
    return {g:t[0],n:x.length,
      t:x.filter(r=>r.lastc&&days(r.lastc,T)<=7).length,
      s:x.filter(r=>!r.lastc||days(r.lastc,T)>14).length};
  });
  const unset=open.filter(r=>!/^[ABC]/.test(r.priority)).length;
  document.getElementById('mix').innerHTML=
    '<div class="h">Priority</div><div class="h" style="text-align:right">Accounts</div>'+
    '<div class="h" style="text-align:right">Touched 7d</div><div class="h" style="text-align:right">Stale 14d+</div>'+
    mix.map(m=>`<div class="c">${m.g}</div><div class="n">${m.n}</div>
      <div class="n hi">${m.t}</div><div class="n">${m.s}</div>`).join('')+
    (unset?`<div class="c">Not set</div><div class="n">${unset}</div>
      <div class="n">—</div><div class="n">—</div>`:'');

  const order={'NEGOTIATING':0,'PROPOSAL SENT':1,'MEETING SET':2};
  const hot=late.slice().sort((a,b)=>(order[a.status]-order[b.status])||a.company.localeCompare(b.company)).slice(0,9);
  document.getElementById('hot').innerHTML=hot.length?hot.map(r=>
    `<div class="row"><div><div class="co">${esc(r.company)}</div>
      <div class="who">${r.priority||'PRIORITY NOT SET'}${r.seg&&/FBO|AVIATION/i.test(r.seg)?' · AVIATION':''}</div></div>
      <div class="tag money">${r.status}</div></div>`).join('')
    :'<div class="empty">No deals past proposal stage</div>';

  const newest=rows.filter(r=>r.added).sort((a,b)=>b.added-a.added).slice(0,9);
  document.getElementById('newest').innerHTML=newest.length?newest.map(r=>{
    const d=days(r.added,T);
    return `<div class="row"><div><div class="co">${esc(r.company)}</div>
      <div class="who">${r.status}</div></div>
      <div class="tag money">${d===0?'TODAY':d===1?'1 DAY':d+' DAYS'}</div></div>`;}).join('')
    :'<div class="empty">No accounts with a date yet</div>';
  document.getElementById('new-note').textContent=newWk.length+' this week';

  const cov=[
    ['High priority open',open.filter(r=>r.priority.startsWith('A')).length,'A accounts'],
    ['Qualified or better',rows.filter(r=>['QUALIFIED','MEETING SET','PROPOSAL SENT','NEGOTIATING'].includes(r.status)).length,'past first contact'],
    ['Still to contact',rows.filter(r=>r.status==='NEW LEAD').length,'never touched'],
    ['Untouched 14d+',stale.length,'needs a call'],
    ['Aviation / FBO',rows.filter(r=>/FBO|AVIATION/i.test(r.seg)).length,'segment'],
    ['Closed won',won.length,'accounts secured']
  ];
  document.getElementById('coverage').innerHTML=cov.map(c=>
    `<div class="row"><div><div class="co">${c[0]}</div><div class="who">${c[2].toUpperCase()}</div></div>
     <div class="tag money">${c[1]}</div></div>`).join('');

  const srcs=[...new Set(rows.map(r=>r.source).filter(Boolean))].map(s=>{
    const x=rows.filter(r=>r.source===s), w=x.filter(r=>r.status==='CLOSED WON').length;
    return {s,n:x.length,w,cv:x.length?(w/x.length*100).toFixed(0):0};
  }).sort((a,b)=>b.n-a.n);
  document.getElementById('sources').innerHTML=
    '<div class="h">Source</div><div class="h" style="text-align:right">Leads</div>'+
    '<div class="h" style="text-align:right">Won</div><div class="h" style="text-align:right">Rate</div>'+
    srcs.map(s=>`<div class="c">${esc(s.s)}</div><div class="n">${s.n}</div>
      <div class="n">${s.w}</div><div class="n hi">${s.cv}%</div>`).join('');
}

/* ---------- boot ---------- */
if (!DATA || !DATA.rows || !DATA.rows.length) {
  document.getElementById('err').textContent = 'NO DATA INJECTED — CHECK THE n8n PUBLISHER';
} else {
  render(norm(DATA.rows));
  if (DATA.generated_at) {
    document.getElementById('stamp-time').textContent = DATA.generated_at;
  }
}
</script>
